{% extends "base.html" %}{% block t %}Новый экзамен{% endblock %}{% block b %}
<div class="pagehead"><div><small>БАНК ТЕСТОВ</small><h2>Новый экзамен</h2></div></div>
<div class="card block">
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" enctype="multipart/form-data" onsubmit="return pack()">
<div class="formrow exambase"><input name="title" placeholder="Название" required>
<input name="subject" placeholder="Предмет">
<label class="dur">Длительность<span class="durbox"><input name="duration_min" type="number" value="30" min="1"> мин</span></label></div>
<div id="qs"></div>
<div class="formrow examacts">
<button class="btn y" type="button" onclick="addQ()">+ Вопрос</button>
<button class="btn g" type="submit">Сохранить</button></div>
<input type="hidden" name="questions_json" id="qj">
</form></div>
<script>
let qseq=0;
function updNums(){document.querySelectorAll('#qs .qcard').forEach((d,i)=>{
d.querySelector('.qnum').textContent='Вопрос '+(i+1);});}
function addQ(q){q=q||{q:'',options:['','','',''],correct:0};
 const d=document.createElement('div');d.className='qcard';const n=qseq++;
 d.innerHTML=`<div class="qhead"><span class="qnum"></span><button class="btn r sm" type="button" onclick="this.closest('.qcard').remove();updNums();">Убрать вопрос</button></div>
 <input class="qt" placeholder="Текст вопроса *">
 <label class="imgpick"><span class="msr">image</span><span class="imgtxt">Картинка к вопросу (до 3 МБ)</span><input type="file" name="qimg_${n}" accept="image/*" hidden onchange="this.closest('.imgpick').querySelector('.imgtxt').textContent=this.files[0]?this.files[0].name:'Картинка к вопросу (до 3 МБ)'"></label>
 <div class="opts">${q.options.map((o,i)=>`<label class="optrow"><input type="radio" name="c${n}" ${i===q.correct?'checked':''} value="${i}" title="Правильный ответ"><input class="qo" placeholder="Вариант ${i+1}"></label>`).join('')}</div>`;
 document.getElementById('qs').appendChild(d);updNums();}
function pack(){const out=[];let bad='';
 document.querySelectorAll('#qs .qcard').forEach((d,ord)=>{
  d.querySelector('input[type=file]').name='qimg_'+ord;
  const opts=[...d.querySelectorAll('.qo')].map(i=>i.value.trim()).filter(o=>o);
  const c=d.querySelector('input[type=radio]:checked');
  const t=d.querySelector('.qt').value.trim();
  if(!t)bad='У всех вопросов должен быть текст';
  else if(opts.length<2)bad='Нужно минимум 2 варианта ответа';
  else out.push({q:d.querySelector('.qt').value,options:[...d.querySelectorAll('.qo')].map(i=>i.value),correct:c?+c.value:0});});
 if(bad){alert(bad);return false;}
 if(!out.length){alert('Добавьте хотя бы один вопрос');return false;}
 document.getElementById('qj').value=JSON.stringify(out);return true;}
addQ();
</script>{% endblock %}
