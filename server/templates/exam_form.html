{% extends "base.html" %}{% block t %}{{ T.ef_new }}{% endblock %}{% block b %}
<div class="pagehead"><div><small>{{ T.e_bank }}</small><h2>{{ T.ef_new }}</h2></div></div>
<div class="card block">
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" enctype="multipart/form-data" onsubmit="return pack()">
<div class="formrow exambase"><input name="title" placeholder="{{ T.ef_title_ph }}" required>
<input name="subject" placeholder="{{ T.ef_subj_ph }}">
<label class="dur">{{ T.ef_dur }}<span class="durbox"><input name="duration_min" type="number" value="30" min="1"> {{ T.ef_min }}</span></label></div>
<div class="formrow">
  <button class="btn p sm" type="button" id="aiBtn"><span class="msr">translate</span> {{ T.ef_ai_btn }}</button>
  <button class="chip" type="button" id="tabRu" aria-pressed="true">{{ T.ef_tab_ru }}</button>
  <button class="chip" type="button" id="tabKk" aria-pressed="false">{{ T.ef_tab_kk }}</button>
</div>
<p class="hint" id="kkHint" hidden>{{ T.ef_kk_hint }}</p>
<div id="qs"></div>
<div id="qsKk" hidden></div>
<div class="formrow examacts">
<button class="btn y" type="button" onclick="addQ()">{{ T.ef_addq }}</button>
<button class="btn g" type="submit">{{ T.ef_save }}</button></div>
<input type="hidden" name="questions_json" id="qj">
</form></div>
<script>
const ET={q:'{{ T.ef_q }}',delq:'{{ T.ef_delq }}',qph:'{{ T.ef_q_ph }}',img:'{{ T.ef_img }}',
opt:'{{ T.ef_opt }}',need_title:'{{ T.ef_need_title }}',need_opt:'{{ T.ef_need_opt }}',
need_one:'{{ T.ef_need_one }}',ai_fail:'{{ T.ef_ai_fail }}',ai_nokey:'{{ T.ef_ai_nokey }}',
ai_busy:'{{ T.ef_ai_busy }}',ai_btn:'{{ T.ef_ai_btn }}'};
let qseq=0;
function updNums(){document.querySelectorAll('#qs .qcard').forEach((d,i)=>{
d.querySelector('.qnum').textContent=ET.q+' '+(i+1);});
document.querySelectorAll('#qsKk .qcard').forEach((d,i)=>{
d.querySelector('.qnum').textContent=ET.q+' '+(i+1);});}
function escA(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function addQ(q){q=q||{q:'',options:['','','',''],correct:0};
 const d=document.createElement('div');d.className='qcard';const n=qseq++;
 d.innerHTML=`<div class="qhead"><span class="qnum"></span><button class="btn r sm" type="button" onclick="this.closest('.qcard').remove();updNums();">${ET.delq}</button></div>
 <input class="qt" placeholder="${ET.qph}" value="${escA(q.q)}">
 <label class="imgpick"><span class="msr">image</span><span class="imgtxt">${ET.img}</span><input type="file" name="qimg_${n}" accept="image/*" hidden onchange="this.closest('.imgpick').querySelector('.imgtxt').textContent=this.files[0]?this.files[0].name:'${ET.img}'"></label>
 <div class="opts">${q.options.map((o,i)=>`<label class="optrow"><input type="radio" name="c${n}" ${i===q.correct?'checked':''} value="${i}" title="*"><input class="qo" placeholder="${ET.opt} ${i+1}" value="${escA(o)}"></label>`).join('')}</div>`;
 document.getElementById('qs').appendChild(d);updNums();}
function kkCard(i,nOpts){const d=document.createElement('div');d.className='qcard';d.dataset.i=i;
 let opts='';for(let j=0;j<nOpts;j++)opts+=`<label class="optrow"><input class="qko" placeholder="${ET.opt} ${j+1}"></label>`;
 d.innerHTML=`<div class="qhead"><span class="qnum"></span></div>
 <input class="qkt" placeholder="${ET.qph}">
 <div class="opts">${opts}</div>`;
 return d;}
function syncKk(){const box=document.getElementById('qsKk');
 const ru=[...document.querySelectorAll('#qs .qcard')];
 ru.forEach((d,i)=>{
  let k=box.querySelector(`.qcard[data-i="${i}"]`);
  const ov=[...d.querySelectorAll('.qo')].map(x=>x.value);
  if(!k){k=kkCard(i,ov.length);
   k.querySelector('.qkt').value=d.querySelector('.qt').value;
   [...k.querySelectorAll('.qko')].forEach((x,j)=>{x.value=ov[j]||'';});
   box.appendChild(k);return;}
  const kt=k.querySelector('.qkt');
  if(!kt.value.trim())kt.value=d.querySelector('.qt').value;
  let kos=[...k.querySelectorAll('.qko')];
  const obox=k.querySelector('.opts');
  while(kos.length<ov.length){const l=document.createElement('label');l.className='optrow';
   l.innerHTML=`<input class="qko" placeholder="${ET.opt} ${kos.length+1}">`;
   obox.appendChild(l);kos=[...k.querySelectorAll('.qko')];}
  kos.forEach((x,j)=>{if(!x.value.trim())x.value=ov[j]||'';});});
 [...box.querySelectorAll('.qcard')].forEach(k=>{if(+k.dataset.i>=ru.length)k.remove();});
 updNums();}
function buildKk(list){syncKk();const box=document.getElementById('qsKk');
 list.forEach((q,i)=>{
  const k=box.querySelector(`.qcard[data-i="${i}"]`);if(!k)return;
  if((q.q||'').trim())k.querySelector('.qkt').value=q.q;
  const kos=[...k.querySelectorAll('.qko')];
  (q.options||[]).forEach((o,j)=>{if(kos[j]&&(o||'').trim())kos[j].value=o;});});
 updNums();showTab('kk');}
function collectRu(){const out=[];let bad='';
 document.querySelectorAll('#qs .qcard').forEach((d,ord)=>{
  d.querySelector('input[type=file]').name='qimg_'+ord;
  const opts=[...d.querySelectorAll('.qo')].map(i=>i.value.trim()).filter(o=>o);
  const t=d.querySelector('.qt').value.trim();
  if(!t)bad=ET.need_title;
  else if(opts.length<2)bad=ET.need_opt;
  else out.push({q:d.querySelector('.qt').value,options:[...d.querySelectorAll('.qo')].map(i=>i.value)});});
 return {out,bad};}
function pack(){const {out,bad}=collectRu();
 if(bad){bqAlert(bad);return false;}
 if(!out.length){bqAlert(ET.need_one);return false;}
 syncKk();
 const full=out.map((q,i)=>{
  const k=document.querySelector(`#qsKk .qcard[data-i="${i}"]`);
  const o={...q};
  const kq=k?k.querySelector('.qkt').value:'';
  o.q_kk=(kq||'').trim()||q.q;
  let ko=k?[...k.querySelectorAll('.qko')].map(x=>x.value):[];
  if(ko.length!==q.options.length||!ko.some(x=>(x||'').trim()))ko=[...q.options];
  o.options_kk=ko;
  const c=document.querySelectorAll('#qs .qcard')[i].querySelector('input[type=radio]:checked');
  o.correct=c?+c.value:0;
  return o;});
 document.getElementById('qj').value=JSON.stringify(full);return true;}
function showTab(w){if(w==='kk')syncKk();const ru=w==='ru';
 document.getElementById('qs').hidden=!ru;document.getElementById('qsKk').hidden=ru;
 document.getElementById('kkHint').hidden=ru;
 document.getElementById('tabRu').setAttribute('aria-pressed',ru);
 document.getElementById('tabKk').setAttribute('aria-pressed',!ru);}
document.getElementById('tabRu').onclick=()=>showTab('ru');
document.getElementById('tabKk').onclick=()=>showTab('kk');
const aiB=document.getElementById('aiBtn');
aiB.onclick=async()=>{
 const {out,bad}=collectRu();
 if(bad){bqAlert(bad);return;}
 if(!out.length){bqAlert(ET.need_one);return;}
 aiB.disabled=true;const old=aiB.innerHTML;aiB.innerHTML=ET.ai_busy;
 try{
  const r=await fetch('/api/translate_kk',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({questions:out.map(q=>({q:q.q,options:q.options}))})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||ET.ai_fail);
  buildKk(j.questions);
 }catch(e){bqAlert(ET.ai_fail+': '+(e.message||e));}
 aiB.innerHTML=old;aiB.disabled=false;};
addQ();
</script>{% endblock %}
