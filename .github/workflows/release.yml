name: Release builds

# Раздельные релизы: сайт отдельно, приложение отдельно.
#   сайт      -> тег server-vX.Y.Z  (BaqylauServer-win64.zip)
#   приложение -> тег student-vX.Y.Z (BaqylauStudent-win64.zip)
# Запуск: Actions -> Release builds -> Run workflow
#   (version: 1.0.0, part: both/server/student),
# либо запушить тег server-v* / student-v* / v* (= оба).
# Сборка EXE идёт на windows-latest (на Linux EXE не собрать).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 1.0.0)"
        required: true
        default: 1.0.0
      part:
        description: "What to release"
        required: true
        default: both
        type: choice
        options:
          - both
          - server
          - student
  push:
    tags:
      - "v*"
      - "server-v*"
      - "student-v*"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      server: ${{ steps.r.outputs.server }}
      student: ${{ steps.r.outputs.student }}
    steps:
      - id: r
        shell: bash
        run: |
          VER=""; SRV=false; STU=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"; VER="${VER#v}"
            case "${{ inputs.part }}" in
              server) SRV=true ;;
              student) STU=true ;;
              *) SRV=true; STU=true ;;
            esac
          else
            REF="${{ github.ref_name }}"
            case "$REF" in
              server-v*) VER="${REF#server-v}"; SRV=true ;;
              student-v*) VER="${REF#student-v}"; STU=true ;;
              v*) VER="${REF#v}"; SRV=true; STU=true ;;
            esac
          fi
          if [ -z "$VER" ]; then echo "no version resolved"; exit 1; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "server=$SRV" >> "$GITHUB_OUTPUT"
          echo "student=$STU" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: resolve
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: baqylau/requirements.txt

      - name: Install deps (CPU torch to keep it slim)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r baqylau/requirements.txt
          pip install pyinstaller

      - name: Build BaqylauStudent.exe
        working-directory: baqylau
        run: pyinstaller --noconfirm --clean BaqylauStudent.spec

      - name: Pack student bundle
        working-directory: baqylau
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/BaqylauStudent.exe pkg/
          Copy-Item BaqylauStudent.vbs, start_student.bat pkg/
          Compress-Archive -Path pkg/* -DestinationPath BaqylauStudent-win64.zip -Force

      - name: Pack server bundle
        working-directory: baqylau
        run: |
          New-Item -ItemType Directory -Force srv/BaqylauServer | Out-Null
          Copy-Item -Recurse server srv/BaqylauServer/
          Copy-Item start_server.bat, start_server.sh, BaqylauServer.vbs, requirements-server.txt srv/BaqylauServer/
          Compress-Archive -Path srv/BaqylauServer -DestinationPath BaqylauServer-win64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            baqylau/BaqylauStudent-win64.zip
            baqylau/BaqylauServer-win64.zip

  release-server:
    needs: [resolve, build-windows]
    if: needs.resolve.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles

      - name: Publish server release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-v${{ needs.resolve.outputs.version }}
          name: Baqylau Server v${{ needs.resolve.outputs.version }}
          body: |
            Панель преподавателя (Windows и Linux).

            - Распаковать `BaqylauServer-win64.zip`.
            - Поставить Flask: `pip install -r requirements-server.txt`.
            - Запустить `start_server.bat` (Windows) или `./start_server.sh` (Linux).
            - Первый вход: `admin / admin123`.
          files: bundles/BaqylauServer-win64.zip

  release-student:
    needs: [resolve, build-windows]
    if: needs.resolve.outputs.student == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles

      - name: Publish student release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: student-v${{ needs.resolve.outputs.version }}
          name: Baqylau Student v${{ needs.resolve.outputs.version }}
          body: |
            Приложение ученика (только Windows).

            - Распаковать `BaqylauStudent-win64.zip`.
            - Запустить `BaqylauStudent.exe` (или `BaqylauStudent.vbs`).
            - Окно открывается в полноэкранном режиме, Python не нужен.
          files: bundles/BaqylauStudent-win64.zip
